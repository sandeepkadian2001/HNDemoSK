version: '3.8'

services:
  hackernews-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hackernews-best-stories-api:latest
    container_name: hackernews-best-stories-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - HackerNews__MaxConcurrentOutgoingRequests=25
      - HackerNews__StoryItemCacheDurationMinutes=10
      - HackerNews__BestStoriesCacheDurationMinutes=2
      - HackerNews__BackgroundRefreshIntervalSeconds=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
